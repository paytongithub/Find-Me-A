<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Find Me A – Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/Theme.css">
    <link rel="stylesheet" href="css/ProfilePage.css">
</head>

<body class="pf-body">

    <header class="pf-header">
        <h1>Profile</h1>
        <div class="header-logo">
            <img src="logo.png" alt="Find Me A">
        </div>
    </header>

    <main class="pf-main">

        <div class="pf-user-section">
            <div class="pf-avatar"></div>

            <h2 class="pf-username">Loading...</h2>
            <button class="logout-btn" onclick="logout()">Log Out</button>
            <p class="pf-stats">Loading watch history...</p>
            <p class="pf-stats pink" id="topGenreText">Top Genre Watched: Loading...</p>
        </div>

        <section class="pf-section">
            <h2 class="pf-section-title">Watchlist</h2>

            <div class="pf-carousel-container">
                <button class="pf-arrow left" onclick="scrollCarousel('watchlist', -300)">❮</button>

                <div class="pf-carousel" id="watchlist">
                    <!-- JS inserts posters -->
                </div>

                <button class="pf-arrow right" onclick="scrollCarousel('watchlist', 300)">❯</button>
            </div>
        </section>
        
        <section class="pf-section" style="display:none;">
            <h2 class="pf-section-title">Seen & Reviewed</h2>

            <div class="pf-carousel-container">
                <button class="pf-arrow left" onclick="scrollCarousel('seen', -300)">❮</button>

                <div class="pf-carousel" id="seen">
                    <!-- JS inserts posters -->
                </div>

                <button class="pf-arrow right" onclick="scrollCarousel('seen', 300)">❯</button>
            </div>
        </section>

    </main>

    <nav class="bottom-nav">
        <a href="index.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M3 10.5L12 3l9 7.5" stroke="currentColor" stroke-width="2" fill="none" />
                <path d="M5 10v10h14V10" stroke="currentColor" stroke-width="2" fill="none" />
            </svg>
            <span>Home</span>
        </a>
        <a href="SearchPage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none" />
                <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" />
            </svg>
            <span>Search</span>
        </a>
        <a href="WatchlistPage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke="currentColor" stroke-width="2" fill="none" />
            </svg>
            <span>Watchlist</span>
        </a>
        <!--
        <a href="ReviewPage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M4 20l4-1 10-10-3-3L5 16l-1 4z" stroke="currentColor" stroke-width="2" fill="none" />
                <line x1="14" y1="5" x2="19" y2="10" stroke="currentColor" stroke-width="2" />
            </svg>
            <span>Reviews</span>
        </a>
    -->
        <a href="ProfilePage.html" class="active">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" fill="none" />
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" fill="none" />
            </svg>
            <span>Profile</span>
        </a>
    </nav>


    <script>
        const username = localStorage.getItem("username");

        if (!username) {
            window.location.href = "LoginPage.html";
        }

        function logout() {
            localStorage.removeItem("username");
            localStorage.removeItem("userId");
            window.location.href = "/login";
        }

        const IMAGE_BASE_URL = "https://image.tmdb.org/t/p/w200";

        document.querySelector(".pf-username").textContent = username;

        const avatar = document.querySelector(".pf-avatar");
        avatar.style.backgroundImage = `url("https://api.dicebear.com/8.x/thumbs/svg?seed=${encodeURIComponent(username)}")`;
        avatar.style.backgroundSize = "cover";
        avatar.style.backgroundPosition = "center";


        async function loadProfileWatchlist() {
            try {
                const response = await fetch(`/watchlist?username=${encodeURIComponent(username)}`);

                if (!response.ok) {
                    throw new Error("Failed to load profile watchlist");
                }

                const data = await response.json();

                const watchlist = document.getElementById("watchlist");
                const seen = document.getElementById("seen");

                watchlist.innerHTML = "";
                seen.innerHTML = "";

                document.querySelector(".pf-stats").textContent = `${data.length} watched`;

                const genreCounts = {};

                data.forEach(item => {
                    if (item.genres) {
                        item.genres.forEach(genre => {
                            genreCounts[genre] = (genreCounts[genre] || 0) + 1;
                        });
                    }

                    const img = document.createElement("img");
                    img.className = "pf-poster";
                    img.alt = item.titleName;

                    img.src = item.poster
                        ? `${IMAGE_BASE_URL}${item.poster}`
                        : "https://via.placeholder.com/150x220?text=No+Image";

                    watchlist.appendChild(img);

                    if (item.userRating) {
                        const reviewedImg = img.cloneNode();
                        seen.appendChild(reviewedImg);
                    }
                });

                const topGenre = Object.keys(genreCounts)
                    .sort((a, b) => genreCounts[b] - genreCounts[a])[0];

                document.getElementById("topGenreText").textContent =
                    topGenre ? `Top Genre Watched: ${topGenre}` : "Top Genre Watched: None yet";

            } catch (error) {
                console.error(error);
                document.querySelector(".pf-stats").textContent = "Could not load profile data.";
                document.getElementById("topGenreText").textContent = "";
            }
        }

        function scrollCarousel(id, amount) {
            document.getElementById(id).scrollBy({
                left: amount,
                behavior: "smooth"
            });
        }

        loadProfileWatchlist();
    </script>

</body>
</html>
