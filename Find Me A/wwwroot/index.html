<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Find Me A – Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/Theme.css">
    <link rel="stylesheet" href="css/HomePage.css">
</head>

<body class="hp-body">

    <header class="hp-header">
        <h1>Home</h1>
        <div class="header-logo">
            <img src="logo.png" alt="Find Me A">
        </div>
        <span class="header-welcome" id="headerWelcome"></span>
    </header>

    <main class="hp-main">

        <section class="random-cta-button">
            <a href="RandomGeneratorPage.html" class="random-cta-btn">Don't Know What to Watch?</a>
        </section>

        <section class="hp-section">
            <h2 class="hp-section-title">Featured For You</h2>
            <div class="carousel-wrap">
                <button class="carousel-arrow left" onclick="scrollCarousel('featuredContainer', -300)">&#x2B9C;</button>
                <div id="featuredContainer" class="carousel"></div>
                <button class="carousel-arrow right" onclick="scrollCarousel('featuredContainer', 300)">&#11166;</button>
            </div>
        </section>

        <section class="hp-section">
            <h2 class="hp-section-title">Top Picks For You</h2>
            <div class="carousel-wrap">
                <button class="carousel-arrow left" onclick="scrollCarousel('topPicksContainer', -300)">&#x2B9C;</button>
                <div id="topPicksContainer" class="carousel"></div>
                <button class="carousel-arrow right" onclick="scrollCarousel('topPicksContainer', 300)">&#11166;</button>
            </div>
        </section>

        <section class="hp-section">
            <h2 class="hp-section-title">Trending Now</h2>
            <div class="carousel-wrap">
                <button class="carousel-arrow left" onclick="scrollCarousel('trendingContainer', -300)">&#x2B9C;</button>
                <div id="trendingContainer" class="carousel"></div>
                <button class="carousel-arrow right" onclick="scrollCarousel('trendingContainer', 300)">&#11166;</button>
            </div>
        </section>

    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="active">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M3 10.5L12 3l9 7.5" stroke="currentColor" stroke-width="2" fill="none" />
                <path d="M5 10v10h14V10" stroke="currentColor" stroke-width="2" fill="none" />
            </svg>
            <span>Home</span>
        </a>
        <a href="SearchPage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none" />
                <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" />
            </svg>
            <span>Search</span>
        </a>
        <a href="WatchlistPage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke="currentColor" stroke-width="2" fill="none" />
            </svg>
            <span>Watchlist</span>
        </a>
        <a href="ProfilePage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" fill="none" />
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" fill="none" />
            </svg>
            <span>Profile</span>
        </a>
    </nav>

    <script>
        const username = localStorage.getItem("username");
        if (username) document.getElementById("headerWelcome").textContent = `Welcome, ${username}`;

        const featuredContainer = document.getElementById("featuredContainer");
        const topPicksContainer = document.getElementById("topPicksContainer");
        const trendingContainer = document.getElementById("trendingContainer");

        const IMAGE_BASE_URL = "https://image.tmdb.org/t/p/w500";

        function scrollCarousel(id, amount) {
            document.getElementById(id).scrollBy({ left: amount, behavior: "smooth" });
        }

        function createMovieCard(movie) {
            const card = document.createElement("div");
            card.className = "movie-card";

            card.addEventListener("click", () => {
                if (!movie.id || !movie.mediaType) {
                    alert("This item is missing an ID.");
                    return;
                }
                window.location.href = `DetailsPage.html?id=${movie.id}&type=${movie.mediaType}`;
            });

            const posterUrl = movie.poster ? `${IMAGE_BASE_URL}${movie.poster}` : "";

            card.innerHTML = `
                    <div class="poster-card">
                        ${posterUrl
                    ? `<img src="${posterUrl}" alt="${movie.title}" class="poster">`
                    : `<div class="poster placeholder">No Image</div>`
                }
                        <h3>${movie.title ?? "Untitled"}</h3>
                        <p>&#11088; ${movie.rating ?? "N/A"}</p>
                    </div>
                `;

            return card;
        }

        async function loadSection(url, container) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Failed to load ${url}`);
                const movies = await response.json();
                container.innerHTML = "";
                if (!movies || movies.length === 0) {
                    container.innerHTML = "<p>No movies found.</p>";
                    return;
                }
                movies.forEach(movie => container.appendChild(createMovieCard(movie)));
            } catch (error) {
                container.innerHTML = "<p>Error loading section.</p>";
                console.error(error);
            }
        }

        if (username) {
            loadSection(`/featured?username=${encodeURIComponent(username)}`, featuredContainer);
            loadSection(`/top-picks?username=${encodeURIComponent(username)}`, topPicksContainer);
        } else {
            featuredContainer.innerHTML = "<p>Log in to see personalized picks.</p>";
            topPicksContainer.innerHTML = "<p>Log in to see personalized picks.</p>";
        }

        loadSection("/trending", trendingContainer);
    </script>

</body>
</html>
