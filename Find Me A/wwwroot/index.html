<!DOCTYPE html>
<html>
<head>
    <title>Find Me A – Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Theme.css">
    <link rel="stylesheet" href="HomePage.css">
</head>

<body>
    <div class="page-shell">
    <!-- Header -->
        <header class="header">
            <div class="logo">
                <img src="logo.png" alt="Find Me A">
            </div>
            <div class="header-right">
                <p class="welcome">Welcome, User</p>
            </div>
        </header>

        <section class="random-cta">
            <a href="RandomGeneratorPage.html" class="random-cta-btn">Don't Know What to Watch?</a>
        </section>

        <section class="section">
            <h2 class="section-title">Featured For You</h2>
            <div class="carousel-wrap">
                <button class="carousel-arrow left">&#x2B9C;</button>
                <div id="featuredContainer" class="carousel"></div>
                <button class="carousel-arrow right">&#11166;</button>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">Top Picks For You</h2>
            <div class="carousel-wrap">
                <button class="carousel-arrow left">&#x2B9C;</button>
                <div id="topPicksContainer" class="carousel"></div>
                <button class="carousel-arrow right">&#11166;</button>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">Trending Now</h2>
            <div class="carousel-wrap">
                <button class="carousel-arrow left">&#x2B9C;</button>
                <div id="trendingContainer" class="carousel"></div>
                <button class="carousel-arrow right">&#11166;</button>
            </div>
        </section>


        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <a href="index.html" class="active">
                <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M3 10.5L12 3l9 7.5" stroke="currentColor" stroke-width="2" fill="none"/>
                <path d="M5 10v10h14V10" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
                <span>Home</span>
            </a>
            <a href="SearchPage.html">
              <svg class="nav-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/>
                <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2"/>
                </svg>
                <span>Search</span>
            </a>
            <a href="WatchlistPage.html">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
                <span>Watchlist</span>
            </a>
            <a href="ReviewPage.html">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <path d="M4 20l4-1 10-10-3-3L5 16l-1 4z" stroke="currentColor" stroke-width="2" fill="none"/>
                    <line x1="14" y1="5" x2="19" y2="10" stroke="currentColor" stroke-width="2"/>
                </svg>
                <span>Reviews</span>
            </a>
            <a href="ProfilePage.html">
                <svg class="nav-icon" viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" fill="none"/>
                    <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" fill="none"/>
                </svg>
                <span>Profile</span>
            </a>
        </nav>
        <script>
            const username = localStorage.getItem("username");

            const featuredContainer = document.getElementById("featuredContainer");
            const topPicksContainer = document.getElementById("topPicksContainer");
            const trendingContainer = document.getElementById("trendingContainer");

            const welcomeText = document.querySelector(".welcome");

            const IMAGE_BASE_URL = "https://image.tmdb.org/t/p/w500";

            if (welcomeText && username) {
                welcomeText.textContent = `Welcome, ${username}`;
            }

            function createMovieCard(movie) {
                const card = document.createElement("div");
                card.className = "movie-card";
                const titleName = movie.title ?? movie.name ?? movie.titleName;
                card.addEventListener("click", () => {
                    if (!movie.id || !movie.mediaType) {
                        console.log("Missing movie data:", movie);
                        alert("This item is missing an ID.");
                        return;
                    }

                    window.location.href =
                        `DetailsPage.html?id=${movie.id}&type=${movie.mediaType}`;
                });

                const posterUrl = movie.poster
                    ? `${IMAGE_BASE_URL}${movie.poster}`
                    : "";


                card.innerHTML = `
                    <div class="poster-card">
                        ${
                            posterUrl
                                ? `<img src="${posterUrl}" alt="${movie.title}" class="poster">`
                                : `<div class="poster placeholder">No Image</div>`
                        }
                        <h3>${movie.title ?? "Untitled"}</h3>
                        <p>⭐ ${movie.rating ?? "N/A"}</p>
                    </div>
                `;

                return card;
            }

            document.querySelectorAll(".carousel-wrap").forEach(wrap => {
                const carousel = wrap.querySelector(".carousel");
                const leftBtn = wrap.querySelector(".left");
                const rightBtn = wrap.querySelector(".right");

                leftBtn.addEventListener("click", () => {
                    carousel.scrollBy({ left: -300, behavior: "smooth" });
                });

                rightBtn.addEventListener("click", () => {
                    carousel.scrollBy({ left: 300, behavior: "smooth" });
                });
            });

            async function loadSection(url, container) {
                try {
                    const response = await fetch(url);

                    if (!response.ok) {
                        throw new Error(`Failed to load ${url}`);
                    }

                    const movies = await response.json();
                    container.innerHTML = "";

                    if (!movies || movies.length === 0) {
                        container.innerHTML = "<p>No movies found.</p>";
                        return;
                    }

                    movies.forEach(movie => {
                        container.appendChild(createMovieCard(movie));
                    });
                } catch (error) {
                    container.innerHTML = "<p>Error loading section.</p>";
                    console.error(error);
                }
            }
            if (username) {
                loadSection(`/featured?username=${encodeURIComponent(username)}`, featuredContainer);
                loadSection(`/top-picks?username=${encodeURIComponent(username)}`, topPicksContainer);
            } else {
                featuredContainer.innerHTML = "<p>Log in to see personalized picks.</p>";
                topPicksContainer.innerHTML = "<p>Log in to see personalized picks.</p>";
            }

            loadSection("/trending", trendingContainer);
        </script>
    </div>
</body>
</html>
