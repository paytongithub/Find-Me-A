<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Find Me A – Log In</title>
    <link rel="stylesheet" href="Theme.css">
    <link rel="stylesheet" href="LoginPage.css">
</head>

<body class="auth-body">

    <div class="auth-container">

        <h1 class="auth-title">Welcome Back</h1>

        <div class="auth-form">
            <input type="text" id="username" placeholder="Username or Email" class="auth-input">
            <input type="password" id="password" placeholder="Password" class="auth-input">

            <p id="auth-message" style="color: #ff6b6b; font-size: 14px; margin: 0; min-height: 20px;"></p>

            <button type="button" class="auth-btn gold-btn" onclick="handleLogin()">Log In</button>
        </div>

        <p class="auth-switch">
            Don't have an account?
            <a href="SignUpPage.html">Sign Up</a>
        </p>

    </div>

    <script>
        async function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const msgEl = document.getElementById('auth-message');

            msgEl.style.color = '#ff6b6b';
            msgEl.textContent = '';

            if (!username || !password) {
                msgEl.textContent = 'Please enter your username and password.';
                return;
            }

            const body = new URLSearchParams();
            body.append('username', username);
            body.append('password', password);

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: body.toString()
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('username', username);
                    localStorage.setItem('userId', data.userId);

                    msgEl.style.color = '#90ee90';
                    msgEl.textContent = data.message || 'Login successful!';

                    setTimeout(() => { window.location.href = '/'; }, 800);
                } else {
                    msgEl.textContent = data.error || 'Login failed. Please try again.';
                }
            } catch (err) {
                msgEl.textContent = 'Could not connect to the server. Please try again.';
            }
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') handleLogin();
        });
    </script>

</body>
</html>
