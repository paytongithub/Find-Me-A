<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Find Me A – Log In</title>
    <link rel="stylesheet" href="LoginPage.css">
</head>

<body class="auth-body">

    <div class="auth-container">

        <h1 class="auth-title">Welcome Back</h1>

        <form class="auth-form">
            <input type="text" placeholder="Username or Email" class="auth-input">
            <input type="password" placeholder="Password" class="auth-input">

            <button type="button" class="auth-btn gold-btn">Log In</button>
        </form>

        <p class="auth-switch">
            Don’t have an account?
            <a href="SignUpPage.html">Sign Up</a>
        </p>

    </div>

</body>
</html>
