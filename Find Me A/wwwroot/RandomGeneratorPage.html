<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Find Me A – Random</title>
    <link rel="stylesheet" href="css/Theme.css">
    <link rel="stylesheet" href="css/RandomGenerator.css">
</head>

<body class="rg-body">

    <header class="wl-header">
        <div class="header-logo">
            <img src="logo.png" alt="Find Me A">
        </div>
    </header>

    <main class="rg-main">
        <div class="rg-type-toggle">
            <button id="movieBtn" class="rg-type-btn active" type="button">Movie</button>
            <button id="tvBtn" class="rg-type-btn" type="button">TV Show</button>
        </div>
        <div class="rg-filters">
            <div class="rg-filter">
                <label>Genre</label>
                <select id="genreSelect">
                    <option>All</option>
                    <option>Action</option>
                    <option>Comedy</option>
                    <option>Drama</option>
                    <option>Horror</option>
                    <option>Romance</option>
                    <option>Sci-Fi</option>
                    <option>Thriller</option>
                    <option>Animation</option>
                </select>
            </div>

            <div class="rg-filter">
                <label>Year</label>
                <select id="yearSelect">
                    <option>All</option>
                    <option>2020s</option>
                    <option>2010s</option>
                    <option>2000s</option>
                    <option>90s</option>
                </select>
            </div>

            <div class="rg-filter">
                <label>Provider</label>
                <select id="providerSelect">
                    <option>All</option>
                    <option>Netflix</option>
                    <option>Hulu</option>
                    <option>Prime Video</option>
                    <option>Disney+</option>
                    <option>HBO Max</option>
                </select>
            </div>

            <div class="rg-filter">
                <label>Rating</label>
                <select id="ratingSelect">
                    <option>All</option>
                    <option>G</option>
                    <option>PG</option>
                    <option>PG-13</option>
                    <option>R</option>
                </select>
            </div>
        </div>
        <button class="rg-random-btn" onclick="randomize()">Randomize</button>

        <div id="rg-result" class="rg-result"></div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M3 10.5L12 3l9 7.5" stroke="currentColor" stroke-width="2" fill="none" />
                <path d="M5 10v10h14V10" stroke="currentColor" stroke-width="2" fill="none" />
            </svg>
            <span>Home</span>
        </a>
        <a href="SearchPage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none" />
                <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" />
            </svg>
            <span>Search</span>
        </a>
        <a href="WatchlistPage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke="currentColor" stroke-width="2" fill="none" />
            </svg>
            <span>Watchlist</span>
        </a>
        <!--
        <a href="ReviewPage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M4 20l4-1 10-10-3-3L5 16l-1 4z" stroke="currentColor" stroke-width="2" fill="none" />
                <line x1="14" y1="5" x2="19" y2="10" stroke="currentColor" stroke-width="2" />
            </svg>
            <span>Reviews</span>
        </a>
        -->
        <a href="ProfilePage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" fill="none" />
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" fill="none" />
            </svg>
            <span>Profile</span>
        </a>
    </nav>

    <script>
        const IMAGE_BASE_URL = "https://image.tmdb.org/t/p/w500";
        let selectedType = "movie";

        const movieBtn = document.getElementById("movieBtn");
        const tvBtn = document.getElementById("tvBtn");

        movieBtn.addEventListener("click", () => {
            selectedType = "movie";
            movieBtn.classList.add("active");
            tvBtn.classList.remove("active");
        });

        tvBtn.addEventListener("click", () => {
            selectedType = "tv";
            tvBtn.classList.add("active");
            movieBtn.classList.remove("active");
        });

        async function randomize() {
            const genre = document.getElementById("genreSelect").value;
            const year = document.getElementById("yearSelect").value;
            const provider = document.getElementById("providerSelect").value;
            const rating = document.getElementById("ratingSelect").value;

            const resultContainer = document.getElementById("rg-result");

            const url =
                `/random?type=${encodeURIComponent(selectedType)}` +
                `&genre=${encodeURIComponent(genre)}` +
                `&year=${encodeURIComponent(year)}` +
                `&provider=${encodeURIComponent(provider)}` +
                `&rating=${encodeURIComponent(rating)}`;

            try {
                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("Could not get a random pick.");
                }

                const movie = await response.json();

                const posterUrl = movie.poster
                    ? `${IMAGE_BASE_URL}${movie.poster}`
                    : "";

                resultContainer.innerHTML = `
                        <div class="movie-card">
                            ${posterUrl
                        ? `<img src="${posterUrl}" alt="${movie.title}" class="poster">`
                        : `<div class="poster placeholder">No Image</div>`
                    }
                            <h3>${movie.title}</h3>
                            <p>⭐ ${movie.rating}</p>
                            <p>${movie.overview ?? "No overview available."}</p>
                        </div>
                    `;
            } catch (error) {
                resultContainer.innerHTML = `<p>${error.message}</p>`;
                console.error(error);
            }
        }
    </script>


</body>
</html>
