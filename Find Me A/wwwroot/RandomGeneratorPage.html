<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Find Me A – Random</title>
    <link rel="stylesheet" href="RandomGenerator.css">
</head>

<body class="rg-body">

    <header class="rg-header">
        <h1 class="rg-logo">Find Me A</h1>
        <div class="rg-search-bar">
            <input type="text" class="rg-search-input" placeholder="Search movies, shows, genres...">
            <button class="rg-search-btn">Search</button>
        </div>
    </header>

    <main class="rg-main">
        <h2 class="rg-title">Find Me A...</h2>

        <div class="rg-type-toggle">
            <button class="rg-type-btn active">Movie</button>
            <button class="rg-type-btn">TV Show</button>
        </div>

        <div class="rg-filters">
            <div class="rg-filter">
                <label>Genre</label>
                <select id="genreSelect">
                    <option>All</option>
                    <option>Action</option>
                    <option>Comedy</option>
                    <option>Drama</option>
                    <option>Horror</option>
                </select>
            </div>

            <div class="rg-filter">
                <label>Sub-Genre</label>
                <select>
                    <option>All</option>
                    <option>Rom-Com</option>
                    <option>Thriller</option>
                    <option>Sci-Fi</option>
                </select>
            </div>

            <div class="rg-filter">
                <label>Year</label>
                <select>
                    <option>All</option>
                    <option>2020s</option>
                    <option>2010s</option>
                    <option>2000s</option>
                    <option>90s</option>
                </select>
            </div>

            <div class="rg-filter">
                <label>Streaming Provider</label>
                <select>
                    <option>All</option>
                    <option>Netflix</option>
                    <option>Hulu</option>
                    <option>Prime Video</option>
                    <option>Disney+</option>
                </select>
            </div>

            <div class="rg-filter">
                <label>Rating</label>
                <select>
                    <option>All</option>
                    <option>G</option>
                    <option>PG</option>
                    <option>PG-13</option>
                    <option>R</option>
                </select>
            </div>
        </div>

        <button class="rg-random-btn" onclick="randomize()">Randomize</button>

        <div id="rg-result" class="rg-result"></div>
    </main>

    <nav class="rg-bottom-nav">
        <a href="index.html">Home</a>
        <a href="SearchPage.html">Search</a>
        <a href="WatchlistPage.html">Watchlist</a>
        <a href="ReviewPage.html">Reviews</a>
        <a href="ProfilePage.html">Profile</a>
    </nav>

    <script>
        const IMAGE_BASE_URL = "https://image.tmdb.org/t/p/w500";

        async function randomize() {
            const genre = document.getElementById("genreSelect").value;
            const resultContainer = document.getElementById("rg-result");

            try {
                const response = await fetch(`/random?genre=${encodeURIComponent(genre)}`);

                if (!response.ok) {
                    throw new Error("Could not get a random movie.");
                }

                const movie = await response.json();

                const posterUrl = movie.poster
                    ? `${IMAGE_BASE_URL}${movie.poster}`
                    : "";

                resultContainer.innerHTML = `
                    <div class="movie-card">
                        ${
                            posterUrl
                                ? `<img src="${posterUrl}" alt="${movie.title}" class="poster">`
                                : `<div class="poster placeholder">No Image</div>`
                        }
                        <h3>${movie.title}</h3>
                        <p>⭐ ${movie.rating}</p>
                        <p>${movie.overview ?? "No overview available."}</p>
                    </div>
                `;
            } catch (error) {
                resultContainer.innerHTML = `<p>${error.message}</p>`;
                console.error(error);
            }
        }
    </script>

</body>
</html>
