<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Find Me A – Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/Theme.css">
    <link rel="stylesheet" href="css/DetailsPage.css">
    <link rel="stylesheet" href="css/DetailsPageButtons.css">
</head>

<body class="dt-body">

    <header class="dt-header">
        <button class="dt-back-btn" onclick="history.back()">❮ Back</button>
    </header>

    <main class="dt-main">
        <div class="dt-top">
            <div class="dt-poster-container">
                <img class="dt-poster">
            </div>

            <div class="dt-info">
                <div class="dt-title-row">
                    <h1 class="dt-title"></h1>

                    <div id="actionButtonsContainer" class="dt-action-buttons">
                        <button class="dt-watchlist-icon-btn" id="addWatchlistBtn" title="Add to Watchlist">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" />
                            </svg>
                        </button>
                        <button class="dt-edit-btn" id="editBtn" title="Edit Rating" style="display:none;">Edit</button>
                        <button class="dt-delete-btn" id="deleteBtn" title="Delete from Watchlist" style="display:none;">Delete</button>
                    </div>
                </div>

                <p class="dt-subinfo"></p>
                <p class="dt-summary" id="overviewTest"></p>

                <div id="ratingDisplay" class="dt-rating-display" style="display: none;">
                    <p class="dt-user-rating"><strong>Your Rating:</strong> <span id="userRatingStars"></span></p>
                </div>
            </div>
        </div>

        <div class="dt-bottom">
            <div class="dt-cast">
                <h3 class="dt-section-title">Cast</h3>
                <div id="actorList" class="dt-actors"></div>
            </div>

            <div class="dt-trailer">
                <h3 class="dt-section-title">Trailer</h3>
                <div id="trailerContainer"></div>
            </div>
        </div>

    </main>

    <nav class="bottom-nav">
        <a href="index.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M3 10.5L12 3l9 7.5" stroke="currentColor" stroke-width="2" fill="none" />
                <path d="M5 10v10h14V10" stroke="currentColor" stroke-width="2" fill="none" />
            </svg>
            <span>Home</span>
        </a>
        <a href="SearchPage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none" />
                <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" />
            </svg>
            <span>Search</span>
        </a>
        <a href="WatchlistPage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke="currentColor" stroke-width="2" fill="none" />
            </svg>
            <span>Watchlist</span>
        </a>
        <!--
        <a href="ReviewPage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M4 20l4-1 10-10-3-3L5 16l-1 4z" stroke="currentColor" stroke-width="2" fill="none"/>
                <line x1="14" y1="5" x2="19" y2="10" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span>Reviews</span>
        </a>
        -->
        <a href="ProfilePage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" fill="none" />
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" fill="none" />
            </svg>
            <span>Profile</span>
        </a>
    </nav>

    <script>
        const IMAGE_BASE_URL = "https://image.tmdb.org/t/p/w500";
        const username = localStorage.getItem("username");

        async function loadDetails() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get("id");
            const type = params.get("type");

            if (!id || !type) {
                document.querySelector(".dt-title").textContent = "Invalid title ID";
                return;
            }

            const response = await fetch(`/details-data?id=${id}&type=${type}`);
            const data = await response.json();

            if (!response.ok) {
                document.querySelector(".dt-title").textContent = "Title not found";
                return;
            }

            document.querySelector(".dt-title").textContent = data.titleName;

            document.querySelector(".dt-poster").src = data.posterPath
                ? `${IMAGE_BASE_URL}${data.posterPath}`
                : "https://placehold.co/300x450?text=No+Image";

            const year = data.releaseDate ? new Date(data.releaseDate).getFullYear() : "";
            const genres = data.genres ? data.genres.join(", ") : "";

            document.querySelector(".dt-subinfo").textContent =
                `${year} • ${data.titleType ?? ""} • ${genres}`;

            document.getElementById("overviewTest").textContent =
                data.overview || "No description available.";

            const actorList = document.getElementById("actorList");
            actorList.innerHTML = "";

            if (data.actors && data.actors.length > 0) {
                data.actors.slice(0, 8).forEach(actor => {
                    const actorCard = document.createElement("div");
                    actorCard.className = "actor-card";
                    actorCard.textContent = actor;
                    actorList.appendChild(actorCard);
                });
            }

            const trailerContainer = document.getElementById("trailerContainer");

            if (data.trailerUrl) {
                const trailerKey = data.trailerUrl.includes("v=")
                    ? data.trailerUrl.split("v=")[1]
                    : data.trailerUrl;

                trailerContainer.innerHTML = `
                        <iframe
                            width="100%"
                            height="260"
                            src="https://www.youtube.com/embed/${trailerKey}"
                            frameborder="0"
                            allowfullscreen>
                        </iframe>
                    `;
            } else {
                trailerContainer.innerHTML = "<p>No trailer available.</p>";
            }

            // Check if user has already watched this title
            const ratingDisplay = document.getElementById("ratingDisplay");
            const addBtn = document.getElementById("addWatchlistBtn");
            const editBtn = document.getElementById("editBtn");
            const deleteBtn = document.getElementById("deleteBtn");

            function showAddButton() {
                addBtn.style.display = "";
                editBtn.style.display = "none";
                deleteBtn.style.display = "none";
                addBtn.onclick = () => addToWatchlist(data.titleName, id, type);
                ratingDisplay.style.display = "none";
            }

            if (!username) {
                showAddButton();
            } else {
                // Logged in - check watchlist
                try {
                    const watchlistResponse = await fetch(`/watchlist?username=${encodeURIComponent(username)}`);
                    const watchlist = await watchlistResponse.json();

                    const watchedItem = watchlist.find(item =>
                        item.titleName.toLowerCase() === data.titleName.toLowerCase()
                    );

                    if (watchedItem) {
                        addBtn.style.display = "none";
                        editBtn.style.display = "";
                        deleteBtn.style.display = "";
                        editBtn.onclick = () => editRating(data.titleName);
                        deleteBtn.onclick = () => deleteFromWatchlist(data.titleName);

                        // Display user's rating
                        const stars = watchedItem.userRating
                            ? "★".repeat(watchedItem.userRating) + "☆".repeat(10 - watchedItem.userRating)
                            : "No rating";
                        document.getElementById("userRatingStars").textContent = stars;
                        ratingDisplay.style.display = "block";
                    } else {
                        showAddButton();
                    }
                } catch (error) {
                    console.error("Error checking watchlist:", error);
                    showAddButton();
                }
            }
        }

        async function addToWatchlist(titleName, id, type) {
            const username = localStorage.getItem("username");
            if (!username) {
                alert("You must be logged in to add to watchlist.");
                return;
            }

            const ratingInput = prompt("Enter rating 1-10 (or leave blank):");
            let rating = 0;
            if (ratingInput !== null && ratingInput.trim() !== "") {
                const parsed = Number.parseInt(ratingInput.trim(), 10);
                if (!Number.isInteger(parsed) || parsed < 1 || parsed > 10) {
                    alert("Rating must be a whole number from 1 to 10.");
                    return;
                }
                rating = parsed;
            }

            const response = await fetch(`/watchlist/add?username=${encodeURIComponent(username)}&movieTitle=${encodeURIComponent(titleName)}&rating=${encodeURIComponent(rating)}&mediaType=${encodeURIComponent(type)}&tmdbId=${encodeURIComponent(id)}`, {
                method: "POST"
            });

            const payload = await response.json().catch(() => ({}));
            if (!response.ok) {
                alert(payload.error || "Failed to add to watchlist.");
                return;
            }

            alert(payload.message || "Added to watchlist!");
            // Reload the page to show edit/delete buttons
            location.reload();
        }

        async function editRating(titleName) {
            const username = localStorage.getItem("username");
            if (!username) return;

            const newRating = prompt("Enter new rating (1–10):");
            if (!newRating) return;

            const parsedRating = parseInt(newRating);
            if (isNaN(parsedRating) || parsedRating < 1 || parsedRating > 10) {
                alert("Please enter a number between 1 and 10.");
                return;
            }

            try {
                const response = await fetch(
                    `/watchlist/update?username=${encodeURIComponent(username)}&movieTitle=${encodeURIComponent(titleName)}&newRating=${parsedRating}`,
                    { method: "PUT" }
                );

                if (!response.ok) {
                    throw new Error("Failed to update rating");
                }

                alert("Rating updated successfully!");
                location.reload();
            } catch (error) {
                console.error(error);
                alert("Could not update rating.");
            }
        }

        async function deleteFromWatchlist(titleName) {
            const username = localStorage.getItem("username");
            if (!username) return;

            if (!confirm(`Delete "${titleName}" from watchlist?`)) return;

            try {
                const response = await fetch(
                    `/watchlist/remove?username=${encodeURIComponent(username)}&movieTitle=${encodeURIComponent(titleName)}`,
                    { method: "DELETE" }
                );

                if (!response.ok) {
                    throw new Error("Failed to delete movie");
                }

                alert("Removed from watchlist!");
                location.reload();
            } catch (error) {
                console.error(error);
                alert("Could not delete from watchlist.");
            }
        }

        loadDetails();
    </script>

</body>
</html>
