<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Find Me A – Search</title>
    <link rel="stylesheet" href="SearchPage.css">
</head>

<body class="sp-body">

    <header class="sp-header">
        <h1 class="sp-logo">Find Me A</h1>

        <div class="sp-search-bar">
            <input id="searchInput" type="text" class="sp-search-input" placeholder="Search movies, shows, genres...">
            <button id="searchBtn" class="sp-search-btn">Search</button>
        </div>
    </header>

    <main class="sp-main">
        <h2 class="sp-section-title">Results</h2>
        <div class="sp-grid" id="resultsContainer"></div>
    </main>

    <nav class="sp-bottom-nav">
        <a href="index.html">Home</a>
        <a href="SearchPage.html" class="active">Search</a>
        <a href="WatchlistPage.html">Watchlist</a>
        <a href="ReviewPage.html">Reviews</a>
        <a href="ProfilePage.html">Profile</a>
    </nav>

    <script>
        const searchBtn = document.getElementById("searchBtn");
        const searchInput = document.getElementById("searchInput");
        const resultsContainer = document.getElementById("resultsContainer");

        const IMAGE_BASE_URL = "https://image.tmdb.org/t/p/w500";

        function createMovieCard(movie) {
            const card = document.createElement("div");
            card.className = "sp-card";

            const posterUrl = movie.poster
                ? `${IMAGE_BASE_URL}${movie.poster}`
                : "";

            card.innerHTML = `
                ${
                    posterUrl
                        ? `<img src="${posterUrl}" alt="${movie.title}" class="sp-poster">`
                        : `<div class="sp-poster sp-placeholder">No Image</div>`
                }
                <h3 class="sp-title">${movie.title ?? "Untitled"}</h3>
                <p class="sp-rating">⭐ ${movie.rating ?? "N/A"}</p>
            `;
            return card;
        }

        async function searchMovies() {
            const query = searchInput.value.trim();

            if (!query) {
                resultsContainer.innerHTML = "<p>Please enter a movie title.</p>";
                return;
            }

            try {
                const response = await fetch(`/search?query=${encodeURIComponent(query)}`);

                if (!response.ok) {
                    throw new Error("Search request failed.");
                }

                const movies = await response.json();
                resultsContainer.innerHTML = "";

                if (!movies || movies.length === 0) {
                    resultsContainer.innerHTML = "<p>No results found.</p>";
                    return;
                }

                movies.forEach(movie => {
                    resultsContainer.appendChild(createMovieCard(movie));
                });
            } catch (error) {
                resultsContainer.innerHTML = `<p>Error: ${error.message}</p>`;
                console.error(error);
            }
        }

        searchBtn.addEventListener("click", searchMovies);

        searchInput.addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                searchMovies();
            }
        });
    </script>

</body>
</html>
