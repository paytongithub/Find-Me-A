<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Find Me A – Search</title>
     <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Theme.css">
    <link rel="stylesheet" href="SearchPage.css">
</head>

<body class="sp-body">
    <header class="sp-header">
        <div class="header-logo">
            <img src="logo.png" alt="Find Me A">
        </div>
     
        <div class="sp-search-bar">
            <input id="searchInput" type="text" class="sp-search-input" placeholder="Search movies, shows, genres...">
            <button id="searchBtn" class="sp-search-btn">Search</button>
        </div>
    </header>

    <main class="sp-main">
        <div class="sp-grid" id="resultsContainer"></div>
        <div id="emptyState" class="empty-state">
            <div class="empty-icon">🎬</div>
            <h2>Find your next favorite</h2>
            <p>Search for movies, shows, or genres to get started</p>

            <div class="empty-suggestions">
                <button onclick="quickSearch('Action')">Action</button>
                <button onclick="quickSearch('Romance')">Romance</button>
                <button onclick="quickSearch('Horror')">Horror</button>
                <button onclick="quickSearch('Comedy')">Comedy</button>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M3 10.5L12 3l9 7.5" stroke="currentColor" stroke-width="2" fill="none"/>
            <path d="M5 10v10h14V10" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
            <span>Home</span>
        </a>
        <a href="SearchPage.html" class="active">
            <svg class="nav-icon" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/>
            <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span>Search</span>
        </a>
        <a href="WatchlistPage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
            <span>Watchlist</span>
        </a>
        <a href="ReviewPage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M4 20l4-1 10-10-3-3L5 16l-1 4z" stroke="currentColor" stroke-width="2" fill="none"/>
                <line x1="14" y1="5" x2="19" y2="10" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span>Reviews</span>
        </a>
        <a href="ProfilePage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" fill="none"/>
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" fill="none"/>
            </svg>
            <span>Profile</span>
        </a>
    </nav>

    <script>
        const searchBtn = document.getElementById("searchBtn");
        const searchInput = document.getElementById("searchInput");
        const resultsContainer = document.getElementById("resultsContainer");

        const IMAGE_BASE_URL = "https://image.tmdb.org/t/p/w500";

        function createMovieCard(movie) {
            const card = document.createElement("div");
            card.className = "sp-card";
            const titleName = movie.title ?? movie.name ?? movie.titleName;
            card.addEventListener("click", () => {
                if (!movie.id || !movie.mediaType) {
                    console.log("Missing movie data:", movie);
                    alert("This item is missing an ID.");
                    return;
                }

                window.location.href =
                    `DetailsPage.html?id=${movie.id}&type=${movie.mediaType}`;
            })

            const posterUrl = movie.poster
                ? `${IMAGE_BASE_URL}${movie.poster}`
                : "";

            card.innerHTML = `
                ${
                    posterUrl
                        ? `<img src="${posterUrl}" alt="${movie.title}" class="sp-poster">`
                        : `<div class="sp-poster sp-placeholder">No Image</div>`
                }
                <h3 class="sp-title">${movie.title ?? "Untitled"}</h3>
                <p class="sp-rating">⭐ ${movie.rating ?? "N/A"}</p>
            `;
            return card;
        }

        async function searchMovies() {
            const query = searchInput.value.trim();

            if (!query) {
                resultsContainer.innerHTML = "<p>Please enter a movie title.</p>";
                return;
            }

            try {
                const response = await fetch(`/search?query=${encodeURIComponent(query)}`);

                if (!response.ok) {
                    throw new Error("Search request failed.");
                }

                const movies = await response.json();
                showResults(movies);
            } catch (error) {
                resultsContainer.innerHTML = `<p>Error: ${error.message}</p>`;
                console.error(error);
            }
        }

        searchBtn.addEventListener("click", searchMovies);

        searchInput.addEventListener("keypress", function (event) {
            if (event.key === "Enter") {
                searchMovies();
            }
        });

        function showResults(movies) {
            const container = document.getElementById("resultsContainer");
            const empty = document.getElementById("emptyState");

            container.innerHTML = "";

            if (movies.length === 0) {
                empty.style.display = "flex";
                return;
            }

            empty.style.display = "none";

            movies.forEach(movie => {
                container.appendChild(createMovieCard(movie));
            });
        }
        function quickSearch(term) {
            searchInput.value = term;
            searchMovies(); 
        }


    </script>

</body>
</html>
