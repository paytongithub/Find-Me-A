<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Find Me A – Watchlist</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Theme.css">
    <link rel="stylesheet" href="WatchlistPage.css">
</head>
<style>
    .wl-body {
        background: #3f3937;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family: 'Poppins', sans-serif;
        color: #fff;
    }

    .wl-header {
        background: rgba(0, 0, 0, 0.3);
        padding: 20px;
        text-align: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

        .wl-header h1 {
            margin: 0;
            font-size: 28px;
        }

    .wl-main {
        flex: 1;
        padding: 30px;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-content: flex-start;
        justify-content: flex-start;
        overflow-y: auto;
    }

    .wl-tile {
        width: 150px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
    }

    .wl-poster {
        width: 150px;
        height: 220px;
        object-fit: cover;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        background: rgba(255, 255, 255, 0.1);
    }

    .wl-poster-placeholder {
        width: 150px;
        height: 220px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        border: 2px dashed rgba(255, 255, 255, 0.3);
    }

    .wl-rating {
        text-align: center;
        font-weight: 600;
        font-size: 14px;
        color: #ffd700;
    }

    .wl-buttons {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
    }

    .wl-btn {
        width: 100%;
        padding: 8px 12px;
        border: none;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .wl-edit-btn {
        background: gold;
        color: black;
    }

        .wl-edit-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

    .wl-delete-btn {
        background: black;
        color: gold;
    }

        .wl-delete-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }

    .empty-message {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        opacity: 0.6;
    }

    .wl-add-wrapper {
        padding: 15px 30px;
        display: flex;
        justify-content: center;
    }

    .wl-add-btn {
        padding: 10px 30px;
        background: gold;
        color: black;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }

        .wl-add-btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
        }
</style>

<body class="wl-body">

    <header class="wl-header">
        <h1>My Watchlist</h1>
    </header>

    <div class="wl-add-wrapper">
        <button class="wl-add-btn" onclick="addFilm()">+ Add Film</button>
    </div>

    <main class="wl-main" id="seen-list">
        <!-- Tiles loaded from backend -->
    </main>

    <nav class="bottom-nav">
        <a href="index.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M3 10.5L12 3l9 7.5" stroke="currentColor" stroke-width="2" fill="none" />
                <path d="M5 10v10h14V10" stroke="currentColor" stroke-width="2" fill="none" />
            </svg>
            <span>Home</span>
        </a>
        <a href="SearchPage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none" />
                <line x1="16.5" y1="16.5" x2="21" y2="21" stroke="currentColor" stroke-width="2" />
            </svg>
            <span>Search</span>
        </a>
        <a href="WatchlistPage.html" class="active">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke="currentColor" stroke-width="2" fill="none" />
            </svg>
            <span>Watchlist</span>
        </a>
        <a href="ReviewPage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <path d="M4 20l4-1 10-10-3-3L5 16l-1 4z" stroke="currentColor" stroke-width="2" fill="none" />
                <line x1="14" y1="5" x2="19" y2="10" stroke="currentColor" stroke-width="2" />
            </svg>
            <span>Reviews</span>
        </a>
        <a href="ProfilePage.html">
            <svg class="nav-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2" fill="none" />
                <path d="M4 20c0-4 4-6 8-6s8 2 8 6" stroke="currentColor" stroke-width="2" fill="none" />
            </svg>
            <span>Profile</span>
        </a>
    </nav>

    <script>
        const username = localStorage.getItem("username");

        if (!username) {
            window.location.href = "LoginPage.html";
        }

        async function loadWatchlist() {
            try {
                const response = await fetch(`/watchlist?username=${encodeURIComponent(username)}`);

                if (!response.ok) {
                    throw new Error("Failed to load watchlist");
                }

                const data = await response.json();
                const container = document.getElementById("seen-list");
                container.innerHTML = "";

                if (!data || data.length === 0) {
                    container.innerHTML = "<div class='empty-message'>No watched movies yet.</div>";
                    return;
                }

                data.forEach(item => {
                    const tile = document.createElement("div");
                    tile.className = "wl-tile";

                    const posterUrl = item.poster
                        ? `https://image.tmdb.org/t/p/w200${item.poster}`
                        : "";

                    const stars = item.userRating
                        ? "★".repeat(item.userRating) + "☆".repeat(10 - item.userRating)
                        : "No rating";

                    tile.innerHTML = `
                            ${posterUrl
                            ? `<img src="${posterUrl}" class="wl-poster" alt="${item.titleName}" title="${item.titleName}">`
                            : `<div class="wl-poster-placeholder">🎬</div>`
                        }
                            <div class="wl-rating">${stars}</div>
                            <div class="wl-buttons">
                                <button class="wl-btn wl-edit-btn" onclick="changeRating('${item.titleName.replace(/'/g, "\\'")}')">Edit</button>
                                <button class="wl-btn wl-delete-btn" onclick="deleteFilm('${item.titleName.replace(/'/g, "\\'")}')">Delete</button>
                            </div>
                        `;

                    container.appendChild(tile);
                });
            } catch (error) {
                document.getElementById("seen-list").innerHTML = "<div class='empty-message'>Error loading watchlist.</div>";
                console.error(error);
            }
        }

        async function deleteFilm(titleName) {
            if (!confirm(`Delete "${titleName}" from watchlist?`)) return;

            try {
                const response = await fetch(
                    `/watchlist/remove?username=${encodeURIComponent(username)}&movieTitle=${encodeURIComponent(titleName)}`,
                    { method: "DELETE" }
                );

                if (!response.ok) {
                    throw new Error("Failed to delete movie");
                }

                loadWatchlist();
            } catch (error) {
                console.error(error);
                alert("Could not delete movie.");
            }
        }

        async function changeRating(titleName) {
            const newRating = prompt("Enter new rating (1–10):");

            if (!newRating) return;

            const parsedRating = parseInt(newRating);

            if (isNaN(parsedRating) || parsedRating < 1 || parsedRating > 10) {
                alert("Please enter a number between 1 and 10.");
                return;
            }

            try {
                const response = await fetch(
                    `/watchlist/update?username=${encodeURIComponent(username)}&movieTitle=${encodeURIComponent(titleName)}&newRating=${parsedRating}`,
                    { method: "PUT" }
                );

                if (!response.ok) {
                    throw new Error("Failed to update rating");
                }

                loadWatchlist();
            } catch (error) {
                console.error(error);
                alert("Could not update rating.");
            }
        }

        function addFilm() {
            const titleName = prompt("Enter movie title:");
            if (!titleName) return;

            const rating = prompt("Enter rating (1–10):");
            const parsedRating = parseInt(rating);

            if (isNaN(parsedRating) || parsedRating < 1 || parsedRating > 10) {
                alert("Please enter a number between 1 and 10.");
                return;
            }

            fetch(
                `/watchlist/add?username=${encodeURIComponent(username)}&movieTitle=${encodeURIComponent(titleName)}&rating=${parsedRating}`,
                { method: "POST" }
            )
                .then(response => {
                    if (!response.ok) throw new Error("Failed to add movie");
                    return response.json();
                })
                .then(() => loadWatchlist())
                .catch(error => {
                    console.error(error);
                    alert("Could not add movie.");
                });
        }

        loadWatchlist();
    </script>

</body>
</html>
