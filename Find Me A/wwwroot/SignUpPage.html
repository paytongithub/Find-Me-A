<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Find Me A – Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Theme.css">
    <link rel="stylesheet" href="SignUpPage.css">
</head>

<body class="auth-body">

    <div class="auth-container">

        <h1 class="auth-title">Create Account</h1>

        <div class="auth-form">
            <input type="text" id="username" placeholder="Username" class="auth-input">
            <input type="password" id="password" placeholder="Password" class="auth-input">
            <input type="password" id="confirmPassword" placeholder="Confirm Password" class="auth-input">

            <p id="auth-message" style="color: #ff6b6b; font-size: 14px; margin: 0; min-height: 20px;"></p>

            <button type="button" class="auth-btn gold-btn" onclick="handleSignUp()">Sign Up</button>
        </div>

        <p class="auth-switch">
            Already have an account?
            <a href="LoginPage.html">Log In</a>
        </p>

    </div>

    <script>
        async function handleSignUp() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const msgEl = document.getElementById('auth-message');

            msgEl.style.color = '#ff6b6b';
            msgEl.textContent = '';

            if (!username || !password || !confirmPassword) {
                msgEl.textContent = 'Please fill in all fields.';
                return;
            }

            if (password !== confirmPassword) {
                msgEl.textContent = 'Passwords do not match.';
                return;
            }

            const body = new URLSearchParams();
            body.append('username', username);
            body.append('password', password);

            try {
                const res = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: body.toString()
                });

                const data = await res.json();

                if (res.ok) {
                    msgEl.style.color = '#90ee90';
                    msgEl.textContent = data.message || 'Account created!';

                    // Redirect to login after a moment
                    setTimeout(() => { window.location.href = 'LoginPage.html'; }, 1000);
                } else {
                    msgEl.textContent = data.error || 'Sign up failed. Please try again.';
                }
            } catch (err) {
                msgEl.textContent = 'Could not connect to the server. Please try again.';
            }
        }

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') handleSignUp();
        });
    </script>

</body>
</html>
