<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
 <title>Find Me A – Watchlist</title>
    <link rel="stylesheet" href="WatchlistPage.css">
</head>

<body class="wl-body">

    <header class="wl-header">
        <h1 class="wl-title">Watchlist</h1>
        <button class="wl-add-btn" onclick="addFilm()">+ Add Film</button>
    </header>

    <main class="wl-main" id="seen-list">
        <!-- Items loaded from backend -->
    </main>

    <nav class="wl-bottom-nav">
        <a href="HomePage.html">Home</a>
        <a href="SearchPage.html">Search</a>
        <a href="WatchlistPage.html" class="active">Watchlist</a>
        <a href="ReviewPage.html">Reviews</a>
        <a href="ProfilePage.html">Profile</a>
    </nav>

    <script>
        const username = "Username"; // Replace with logged-in user

        async function loadWatchlist() {
            const response = await fetch(`/api/watchlist/${username}`);
            const data = await response.json();

            const container = document.getElementById("seen-list");
            container.innerHTML = "";

            data.forEach(item => {
                const card = document.createElement("div");
                card.className = "wl-card";

                const posterUrl = `https://image.tmdb.org/t/p/w200/${item.Title.PosterPath}`;

                card.innerHTML = `
                    <img src="${posterUrl}" class="wl-poster">

                    <div class="wl-info">
                        <h3>${item.Title.TitleName}</h3>

                        <div class="wl-stars">
                            ${"★".repeat(item.UserRating ?? 0)}${"☆".repeat(5 - (item.UserRating ?? 0))}
                        </div>

                        <div class="wl-actions">
                            <button class="wl-edit-btn" onclick="changeRating('${item.Title.TitleName}')">Edit Rating</button>
                            <button class="wl-delete-btn" onclick="deleteFilm('${item.Title.TitleName}')">Delete</button>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        async function deleteFilm(titleName) {
            await fetch(`/api/watchlist/${username}/${titleName}`, { method: "DELETE" });
            loadWatchlist();
        }

        async function changeRating(titleName) {
            const newRating = prompt("Enter new rating (1–5):");
            if (newRating >= 1 && newRating <= 5) {
                await fetch(`/api/watchlist/${username}/${titleName}/rating/${newRating}`, { method: "PUT" });
                loadWatchlist();
            }
        }

        function addFilm() {
            alert("This will open an Add Film popup once the API is ready.");
        }

        loadWatchlist();
    </script>

</body>
</html
