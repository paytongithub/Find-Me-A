<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Find Me A – Profile</title>
    <link rel="stylesheet" href="ProfilePage.css">
</head>

<body class="pf-body">

    <header class="pf-header">
        <h1 class="pf-logo">Find Me A</h1>
    </header>

    <main class="pf-main">

        <!-- USER INFO -->
        <div class="pf-user-section">
            <div class="pf-avatar"></div>

            <h2 class="pf-username">User</h2>

            <p class="pf-stats">28 reviews</p>
            <p class="pf-stats pink">Top Genre Watched: Comedy</p>
        </div>

        <!-- WATCHLIST SECTION -->
        <section class="pf-section">
            <h2 class="pf-section-title">Watchlist</h2>

            <div class="pf-carousel-container">
                <button class="pf-arrow left" onclick="scrollCarousel('watchlist', -300)">❮</button>

                <div class="pf-carousel" id="watchlist">
                    <!-- JS inserts posters -->
                </div>

                <button class="pf-arrow right" onclick="scrollCarousel('watchlist', 300)">❯</button>
            </div>
        </section>

        <!-- SEEN & REVIEWED SECTION -->
        <section class="pf-section">
            <h2 class="pf-section-title">Seen & Reviewed</h2>

            <div class="pf-carousel-container">
                <button class="pf-arrow left" onclick="scrollCarousel('seen', -300)">❮</button>

                <div class="pf-carousel" id="seen">
                    <!-- JS inserts posters -->
                </div>

                <button class="pf-arrow right" onclick="scrollCarousel('seen', 300)">❯</button>
            </div>
        </section>

    </main>

    <nav class="pf-bottom-nav">
        <a href="HomePage.html">Home</a>
        <a href="SearchPage.html">Search</a>
        <a href="WatchlistPage.html">Watchlist</a>
        <a href="ReviewPage.html">Reviews</a>
        <a href="ProfilePage.html" class="active">Profile</a>
    </nav>

    <script>// Mock data for now
        const watchlistData = [
            "https://via.placeholder.com/150x220?text=The+Recruit",
            "https://via.placeholder.com/150x220?text=Hudson+%26+Rex",
            "https://via.placeholder.com/150x220?text=Cabin+10"
        ];

        const seenData = [
            "https://via.placeholder.com/150x220?text=Don%27t+Move",
            "https://via.placeholder.com/150x220?text=Bridgerton",
            "https://via.placeholder.com/150x220?text=School+Spirits"
        ];

        function loadCarousel(id, data) {
            const container = document.getElementById(id);
            data.forEach(src => {
                const img = document.createElement("img");
                img.src = src;
                img.className = "pf-poster";
                container.appendChild(img);
            });
        }

        function scrollCarousel(id, amount) {
            document.getElementById(id).scrollBy({ left: amount, behavior: "smooth" });
        }

        loadCarousel("watchlist", watchlistData);
        loadCarousel("seen", seenData);</script>

</body>
</html>
